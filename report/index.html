<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미소방문 파트너 리포트</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-text-size-adjust:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:#F6F7F9;color:#1A1D24;line-height:1.6;padding:0 0 44px}
  .w{max-width:440px;margin:0 auto}
  .hd{background:#2563EB;color:#fff;padding:22px 22px 20px;
      display:flex;justify-content:space-between;align-items:center;gap:12px}
  .hd-text{flex:1;min-width:0}
  .hd h1{font-size:20px;font-weight:700;margin:0 0 6px}
  .hd .pd{font-size:13px;opacity:.9}
  .hd .logo{flex-shrink:0;height:22px;display:block}
  .cd{background:#fff;margin:13px 16px 0;border-radius:16px;padding:20px 19px;
    box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .ey{font-size:12px;font-weight:700;color:#2563EB;letter-spacing:.03em;margin-bottom:4px}
  h2{font-size:17px;font-weight:700;margin:0 0 14px}
  .cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;text-align:center}
  .ml{font-size:12px;color:#6B7280;margin-bottom:6px}
  .nm{font-size:21px;font-weight:700}
  .ar{font-size:13px;color:#6B7280;padding-top:16px}
  .rv{height:1px;background:#E8EAED;grid-column:1/4;margin:2px 0}
  .nt{background:#EFF4FF;border-radius:11px;padding:11px 14px;font-size:13px;margin-top:13px}
  .ps{font-size:13px;color:#6B7280;margin:-4px 0 15px}
  .gb{margin-bottom:17px}
  .gb:last-child{margin-bottom:0}
  .gh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .gt{font-size:14.5px;font-weight:600}
  .tg{font-size:12px;font-weight:700;padding:2px 9px;border-radius:20px}
  .tk{position:relative;height:9px;border-radius:6px;
    background:linear-gradient(90deg,#DBEAFE 0%,#EEF0F3 50%,#FBE3CC 100%)}
  .mk{position:absolute;top:50%;width:15px;height:15px;background:#fff;
    border:4px solid #1A1D24;border-radius:50%;transform:translate(-50%,-50%)}
  .sc{display:flex;justify-content:space-between;font-size:10.5px;color:#6B7280;margin-top:5px}
  .sr{display:flex;justify-content:space-between;align-items:center;
    background:#F6F7F9;border-radius:10px;padding:11px 14px;font-size:14px;margin-top:4px}
  .sv{font-weight:700;font-size:16px}
  .nd{background:#F6F7F9;border-radius:11px;padding:18px;text-align:center;
    font-size:13px;color:#6B7280;line-height:1.6}
  .ch{display:flex;gap:11px;align-items:flex-start}
  .ch+.ch{margin-top:15px;padding-top:15px;border-top:1px solid #E8EAED}
  .ci{flex-shrink:0;width:32px;height:32px;border-radius:9px;background:#EFF4FF;
    display:flex;align-items:center;justify-content:center}
  .ci svg{width:18px;height:18px;stroke:#2563EB;fill:none;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}
  .cb strong{display:block;font-size:15px;margin-bottom:4px}
  .cb p{font-size:13.5px;margin:0 0 4px;line-height:1.55;color:#374151}
  .fb{background:#EFF4FF;border-radius:11px;padding:14px 15px;font-size:14px}
  .fb .big{font-size:28px;font-weight:800;color:#2563EB;display:block;margin-bottom:6px}
  .tip{background:#EFF4FF;border-radius:11px;padding:15px}
  .tip .tt{font-weight:700;color:#2563EB;margin-bottom:6px}
  .tip .tb{font-size:13.5px;color:#374151}
  .ft{text-align:center;font-size:12px;color:#6B7280;margin:20px 20px 0;line-height:1.7}
  .state{background:#fff;border-radius:12px;margin:40px 16px;padding:40px 20px;
    text-align:center;color:#6B7280;font-size:14px;line-height:1.6}
  .exr{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:4px;align-items:center;text-align:center;margin-bottom:4px}
  .exs{font-size:11px;color:#6B7280;margin-bottom:4px}
  .exv{font-size:19px;font-weight:700}
</style>
</head>

  function n(v){ var x = parseFloat(v); return isNaN(x) ? 0 : x; }
  function ym(m){ m = String(m).replace(/\D/g,'').slice(0,6);
   return { y: +m.slice(0,4), mo: +m.slice(4,6) }; }
  function addM(o,d){ var mo = o.mo+d, y = o.y;
    if(mo > 12){ mo -= 12; y++; } if(mo < 1){ mo += 12; y--; }
    return { y: y, mo: mo }; }
  function esc(s){ return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function fix2(v){ return (Math.round(n(v)*100)/100).toFixed(2); }

  function gapPct(my, m){ return m ? Math.round((my-m)/m*1000)/10 : 0; }
  function barPos(g){
    if(g<=-20) return 20; if(g<=-8) return 35;
    if(g<=8) return 50;   if(g<=20) return 65; return 85;
  }
  function barLabel(g, hw, lw){
    if(g<=-20) return lw+' 편'; if(g<=-8) return '약간 '+lw;
    if(g<=8) return '평균 수준'; if(g<=20) return '약간 '+hw; return hw+' 편';
  }
  function tagStyle(g){
    if(g>8)  return 'color:#E8852B;background:#FDF1E5';
    if(g<-8) return 'color:#2563EB;background:#EFF4FF';
    return 'color:#16A34A;background:#E9F6EC';
  }

  function getCoaching(pg, tg, plg){

  function render(res){

      h += '<div><div class="nm">'+n(d.apr_quote_cnt)+'</div></div><div class="ar">견적 제출 →</div><div><div class="nm">'+n(d.may_quote_cnt)+'</div></div>';
      h += '<div class="rv"></div>';
      h += '<div><div class="nm">'+n(d.apr_contracted_cnt)+'</div></div><div class="ar">계약 →</div><div><div class="nm">'+n(d.may_contracted_cnt)+'</div></div>';
      h += '<div class="rv"></div>';
      h += '<div><div class="nm">'+n(d.apr_psr)+'%</div></div><div class="ar">전환율 →</div><div><div class="nm">'+n(d.may_psr)+'%</div></div>';
    } else {
      h += '<div style="grid-column:1/4;padding:10px 0">';
      h += '<div style="font-size:13px;color:#6B7280;margin-bottom:10px">'+dm.mo+'월 첫 활동 기준</div>';
      h += '<div style="font-size:21px;font-weight:700">'+n(d.may_quote_cnt)+'</div>';
      h += '<div style="font-size:13px;color:#6B7280;margin-top:2px">견적 제출 · 계약 '+n(d.may_contracted_cnt)+'건 · 전환율 '+n(d.may_psr)+'%</div></div>';
    }
    h += '</div>';
    h += '<div class="nt">전체 파트너 평균 전환율은 <b style="color:#2563EB">'+avgPsr+'%</b>예요.<br><span style="color:'+psrColor+'">'+psrMsg+'</span></div></div>';

    // 견적 노출 현황 (큐레이션) — 202606 이전 데이터는 정책 자체가 없었으므로 섹션 미노출
    if (Number(d.month) >= 202606) {
      var excludedCnt = n(d.curation_excluded_cnt);
      var quoteCntCur = n(d.may_quote_cnt);

      h += '<div class="cd"><div class="ey">견적 노출 현황 · '+dm.mo+'월</div>';
      h += '<h2>제출한 견적이 이렇게 노출됐어요</h2>';

      if (excludedCnt === 0) {
        h += '<div class="nd">제출하신 견적이 모두 노출됐어요.</div>';
      } else {
        var exposedCnt = quoteCntCur - excludedCnt;
        var exposureRate = quoteCntCur > 0 ? Math.round(exposedCnt / quoteCntCur * 100) : 0;
        var refundAmt = (excludedCnt * 1000).toLocaleString();

        h += '<div class="exr">';
        h += '<div><div class="exs">제출</div><div class="exv">'+quoteCntCur+'건</div></div>';
        h += '<div style="font-size:12px;color:#6B7280">→</div>';
        h += '<div><div class="exs">노출</div><div class="exv">'+exposedCnt+'건</div></div>';
        h += '<div style="font-size:12px;color:#6B7280">=</div>';
        h += '<div><div class="exs">노출률</div><div class="exv" style="color:#2563EB">'+exposureRate+'%</div></div>';
        h += '</div>';
        h += '<div class="nt">노출되지 않은 '+excludedCnt+'건의 견적참여비 <b>'+refundAmt+'원</b>은 환불됐어요.</div>';

        if (excludedCnt >= 8) {
          var epg  = gapPct(n(d.my_avg_price_on_excluded),  n(d.exposed_avg_price_on_excluded));
          var etg  = gapPct(n(d.my_avg_tons_on_excluded),   n(d.exposed_avg_tons_on_excluded));
          var eplg = gapPct(n(d.my_avg_people_on_excluded), n(d.exposed_avg_people_on_excluded));

          var ebars = [
            {t:'견적 가격대', g:epg,  hw:'높은', lw:'낮은', rl:'높은 편', ll:'낮은 편'},
            {t:'배차 톤수',   g:etg,  hw:'많은', lw:'적은', rl:'많은 편', ll:'적은 편'},
            {t:'투입 인원',   g:eplg, hw:'많은', lw:'적은', rl:'많은 편', ll:'적은 편'}
          ];
          h += '<div style="margin-top:14px;padding-top:13px;border-top:1px solid #E8EAED">';
          h += '<div class="ps" style="margin-top:0">노출되지 않은 대표님의 견적이, 같은 주문에서 노출된 다른 파트너님의 견적과 비교해 이런 위치였어요.</div>';
          for (var k = 0; k < ebars.length; k++) {
            var eb = ebars[k];
            h += '<div class="gb"><div class="gh"><span class="gt">'+eb.t+'</span>';
            h += '<span class="tg" style="'+tagStyle(eb.g)+'">'+barLabel(eb.g, eb.hw, eb.lw)+'</span></div>';
            h += '<div class="tk"><div class="mk" style="left:'+barPos(eb.g)+'%"></div></div>';
            h += '<div class="sc"><span>'+eb.ll+'</span><span>노출 견적 평균</span><span>'+eb.rl+'</span></div></div>';
          }
          h += '</div>';
        } else {
          h += '<div class="nd" style="margin-top:11px">제출하신 대부분의 견적이 노출됐어요.<br>이상이 생기면 알려드릴게요!</div>';
        }
      }
      h += '</div>';
    }

    h += '<div class="cd"><div class="ey">포지셔닝 · '+dm.mo+'월 기준</div><h2>놓친 주문에서 대표님은...</h2>';
    if(lwm < 3){
      h += '<div class="nd">이번 달은 비교 가능한 데이터가 충분하지 않아<br>포지셔닝 분석이 제공되지 않아요.</div>';
    } else {
      h += '<div class="ps">참여하신 주문에서 고객이 고른 다른 파트너님의 견적과 비교했어요.</div>';
      var bars = [
        {t:'견적 가격대', g:pg,  hw:'높은', lw:'낮은', rl:'높은 편', ll:'낮은 편'},
        {t:'배차 톤수',   g:tg,  hw:'많은', lw:'적은', rl:'많은 편', ll:'적은 편'},
        {t:'투입 인원',   g:plg, hw:'많은', lw:'적은', rl:'많은 편', ll:'적은 편'}
      ];
      for(var i=0;i<bars.length;i++){
        var b=bars[i];
        h += '<div class="gb"><div class="gh"><span class="gt">'+b.t+'</span>';
        h += '<span class="tg" style="'+tagStyle(b.g)+'">'+barLabel(b.g,b.hw,b.lw)+'</span></div>';
        h += '<div class="tk"><div class="mk" style="left:'+barPos(b.g)+'%"></div></div>';
        h += '<div class="sc"><span>'+b.ll+'</span><span>평균</span><span>'+b.rl+'</span></div></div>';
      }
      var sTxt = '경쟁자 평균('+fix2(mScore)+') ' + (scoreLow ? '이하' : '이상');
      var sCol = scoreLow ? '#E8852B' : '#16A34A';
      h += '<div class="sr"><span>평점 <span class="sv">'+fix2(myScore)+'</span></span>';
      h += '<span style="color:'+sCol+';font-weight:700">'+sTxt+'</span></div>';
    }
    h += '</div>';

    // 코칭 — lwm<3이면 포지셔닝과 동일 판정으로 안내문구 대체 (근거 없이 결론만 내는 것 방지)
    h += '<div class="cd"><div class="ey">코칭</div><h2>데이터가 말해주는 것</h2>';
    if (lwm < 3) {
      h += '<div class="nd">분석을 위해 더 많은 참여가 필요해요.</div>';
    } else {
      h += '<div class="ch"><div class="ci">'+ICONS[coaching.icon]+'</div><div class="cb"><strong>'+coaching.title+'</strong>';
      for(var j=0;j<coaching.lines.length;j++) h += '<p>'+coaching.lines[j]+'</p>';
      h += '</div></div>';
    }
    // 평점 오버레이는 lwm과 무관한 별도 표본이므로 lwm<3이어도 그대로 유지
    h += '<div class="ch"><div class="ci">'+(scoreLow?ICONS.alert:ICONS.star)+'</div><div class="cb">';
    if(scoreLow){
      h += '<strong>평점이 시장 평균보다 낮아요</strong>';
      h += '<p>내 평점 '+fix2(myScore)+' · 시장 평균 '+fix2(mScore)+'</p>';
      h += '<p>서비스 완료 후 리뷰 요청으로 꾸준히 관리해 보세요.</p>';
    } else {
      h += '<strong>평점은 대표님의 강점이에요</strong>';
      h += '<p>내 평점 '+fix2(myScore)+' · 경쟁자 평균('+fix2(mScore)+') 이상</p>';
    }
    h += '</div></div></div>';

    if(totalC > 0 && totalNL > 0){
      var nlPct = Math.round(totalNL/totalC*100);
      h += '<div class="cd"><div class="ey">계약 분석</div>';
      h += '<h2>계약 '+totalC+'건 중 '+totalNL+'건, 최저가 아니었어요</h2>';
      h += '<div class="fb"><span class="big">'+totalNL+' / '+totalC+'</span>';
      h += '두 달간 대표님의 계약 건의 '+nlPct+'%는 최저가가 아니었어요.<br>견적에 설득력이 있다면 고객은 선택합니다.</div></div>';
    }

    if(res.tip_title){
      h += '<div class="cd"><div class="ey">이번 달의 팁</div><h2>영상 견적, 이렇게 활용하세요</h2>';
      h += '<div class="tip"><div class="tt">'+esc(res.tip_title)+'</div>';
      h += '<div class="tb">'+esc(res.tip_body)+'</div></div></div>';
    }

    h += '<div class="ft">이 리포트는 대표님의 미소방문 활동만으로 작성됐어요.<br>문의는 담당 매니저에게 편하게 연락주세요.</div>';

    document.getElementById('root').innerHTML = h;
  }

  function showState(msg){
    document.getElementById('root').innerHTML = '<div class="state">'+msg+'</div>';
  }

  window.__cb = function(res){
    if(res && res.ok){ render(res); }
    else if(res && res.error === 'NO_REPORT'){ showState('이번 달 리포트 대상이 아니에요.'); }
    else { showState('리포트를 불러오지 못했어요.<br>잠시 후 다시 시도해주세요.'); }
  };

  function load(){
    var params = new URLSearchParams(location.search);
    var pid = params.get('pid');
    var month = params.get('month');
    if(!pid){ showState('잘못된 접근입니다.<br>문자로 받으신 링크로 다시 들어와주세요.'); return; }
    var s = document.createElement('script');
    s.src = EXEC_URL + '?pid=' + encodeURIComponent(pid)
          + (month ? '&month=' + encodeURIComponent(month) : '')
          + '&callback=__cb';
    s.onerror = function(){ showState('리포트를 불러오지 못했어요.<br>잠시 후 다시 시도해주세요.'); };
    document.body.appendChild(s);
  }
  load();
</script>
</body>
</html>

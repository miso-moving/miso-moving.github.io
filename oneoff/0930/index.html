<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>참여 가능 주문 모음</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:#f4f6f9;color:#1f2937;padding:20px 16px 48px;-webkit-text-size-adjust:100%}
  .wrap{max-width:520px;margin:0 auto}
  .head{margin-bottom:18px}
  .head h1{font-size:19px;font-weight:700;color:#1f5c99}
  .head p{font-size:13px;color:#6b7280;margin-top:6px;line-height:1.5}
  .group{margin-top:22px}
  .group:first-child{margin-top:0}
  .glabel{font-size:14px;font-weight:700;color:#1f5c99;padding:0 2px 8px;
    display:flex;align-items:baseline;gap:6px}
  .gcount{font-size:12px;font-weight:500;color:#9ca3af}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px;margin-bottom:10px;
    box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .route{font-size:16px;font-weight:700}
  .arrow{color:#1f5c99;margin:0 4px}
  .meta{font-size:13px;color:#6b7280;margin-top:5px}
  .btn{display:block;text-align:center;margin-top:14px;padding:12px;border-radius:9px;
    background:#1f5c99;color:#fff;font-size:15px;font-weight:600;text-decoration:none}
  .btn:active{background:#174a7c}
  .foot{font-size:12px;color:#9ca3af;text-align:center;margin-top:24px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>참여 가능 주문 모음</h1>
    <p>아직 참여한 업체가 적은 주문이에요.<br>지금 제출하시면 계약 가능성이 높습니다.</p>
  </div>
  <div id="list"></div>
  <div class="foot">이미 견적을 제출하거나 거절한 주문은<br>앱에서 참여가 제한될 수 있습니다.</div>
</div>

<script>
  var BASE = 'https://miso.app/partner/bookingDetail?serviceCode=moving-concierge-rfq&bookingId=';

  var ORDERS = [
    { id:2046821, date:'9월 28일 (월)',  pyeong:40, from:'서울 광진구',        to:'서울 광진구' },

    { id:2049074, date:'9월 30일 (수)',  pyeong:20, from:'서울 강동구',        to:'서울 강동구' },
    { id:2050169, date:'9월 30일 (수)',  pyeong:34, from:'서울 마포구',        to:'서울 마포구' },
    { id:2050266, date:'9월 30일 (수)',  pyeong:25, from:'서울 강서구',        to:'서울 강서구' },
    { id:2050291, date:'9월 30일 (수)',  pyeong:34, from:'서울 성북구',        to:'서울 강북구' },
    { id:2050458, date:'9월 30일 (수)',  pyeong:34, from:'인천 검단구',        to:'경기 김포시' },
    { id:2050663, date:'9월 30일 (수)',  pyeong:20, from:'서울 중랑구',        to:'서울 중랑구' },
    { id:2051109, date:'9월 30일 (수)',  pyeong:25, from:'서울 성동구',        to:'서울 서대문구' },
    { id:2051136, date:'9월 30일 (수)',  pyeong:34, from:'서울 강동구',        to:'서울 중랑구' },
    { id:2051962, date:'9월 30일 (수)',  pyeong:34, from:'경기 김포시',        to:'인천 강화군' },
    { id:2052263, date:'9월 30일 (수)',  pyeong:34, from:'서울 송파구',        to:'서울 송파구' },
    { id:2052519, date:'9월 30일 (수)',  pyeong:20, from:'경기 부천시 소사구',  to:'서울 관악구' },
    { id:2044671, date:'9월 30일 (수)',  pyeong:34, from:'서울 영등포구',      to:'서울 영등포구' },

    { id:2049996, date:'10월 28일 (수)', pyeong:40, from:'서울 용산구',        to:'경기 군포시' },
    { id:2052837, date:'10월 28일 (수)', pyeong:20, from:'서울 서초구',        to:'서울 광진구' },

    { id:2042683, date:'10월 29일 (목)', pyeong:40, from:'서울 금천구',        to:'서울 성북구' },
    { id:2051200, date:'10월 29일 (목)', pyeong:25, from:'인천 제물포구',      to:'인천 제물포구' },

    { id:2045028, date:'10월 30일 (금)', pyeong:31, from:'서울 중랑구',        to:'경기 의정부시' },
    { id:2045373, date:'10월 30일 (금)', pyeong:34, from:'서울 중랑구',        to:'서울 종로구' },
    { id:2049144, date:'10월 30일 (금)', pyeong:25, from:'인천 연수구',        to:'인천 연수구' },
    { id:2052907, date:'10월 30일 (금)', pyeong:25, from:'경기 고양시 일산서구', to:'경기 고양시 일산서구' },

    { id:2046490, date:'11월 1일 (일)',  pyeong:34, from:'서울 광진구',        to:'서울 중랑구' },
    { id:2044199, date:'11월 27일 (금)', pyeong:34, from:'인천 미추홀구',      to:'인천 부평구' },
    { id:2050954, date:'11월 30일 (월)', pyeong:25, from:'서울 송파구',        to:'경기 성남시 수정구' }
  ];

  function esc(s){ return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function card(r){
    return '<div class="card">' +
      '<div class="route">' + esc(r.from) + ' <span class="arrow">→</span> ' + esc(r.to) + '</div>' +
      '<div class="meta">' + esc(r.pyeong) + '평 · 주문번호 ' + esc(r.id) + '</div>' +
      '<a class="btn" href="' + BASE + encodeURIComponent(r.id) + '" target="_blank" rel="noopener">견적 참여하기</a>' +
    '</div>';
  }

  var groups = [];
  ORDERS.forEach(function(r){
    var g = groups[groups.length - 1];
    if(!g || g.date !== r.date){ g = { date:r.date, items:[] }; groups.push(g); }
    g.items.push(r);
  });

  document.getElementById('list').innerHTML = groups.map(function(g){
    return '<div class="group">' +
      '<div class="glabel">' + esc(g.date) +
        '<span class="gcount">' + g.items.length + '건</span></div>' +
      g.items.map(card).join('') +
    '</div>';
  }).join('');
</script>
</body>
</html>
